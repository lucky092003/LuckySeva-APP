name: Keep Render Alive

# Render's free tier spins the API down after ~15 minutes with no inbound
# traffic, after which the first real caller pays a 30-60s cold start (or worse,
# the launch booking flow times out against it). A ping every few minutes is
# cheaper than a paid plan and keeps the service warm.

on:
  # GitHub crons are approximate: under load they can lag by some minutes, so
  # pace below (5 min) leaves slack against Render's 15-minute idle window.
  schedule:
    - cron: '*/5 * * * *'
  # Lets "Run workflow" fire one immediately from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Traffic is the deliverable, not green checks: a tired or down backend is
    # the next request's cold start, not an incident to page on. The URL comes
    # from the RENDER_BACKEND_URL secret/variable when set, falling back to the
    # currently deployed API.
    continue-on-error: true
    env:
      BASE_URL: ${{ secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL || 'https://luckyseva-app-gbjw.onrender.com' }}
    steps:
      - name: Ping /health
        run: |
          set -o pipefail
          echo "Pinging $BASE_URL/health ..."
          curl --silent --show-error --max-time 120 --retry 3 --retry-delay 10 \
            --retry-all-errors --fail-with-body \
            "$BASE_URL/health" \
          | tee /dev/stderr | grep -q '"ok": *true' && echo "Alive." \
            || { echo "Health check did not confirm ok:true"; exit 1; }
