name: Android APKs

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-apks
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Debug builds when signing secrets are not configured (installable via "unknown sources" but not store-worthy)
      BUILD_TYPE: ${{ secrets.ANDROID_KEYSTORE_BASE64 && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/build.gradle', 'android/**/variables.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write frontend .env
        working-directory: frontend
        run: |
          cat > .env <<EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_PHONE_MOCKUP=false
          EOF

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Decode signing keystore
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build customer APK
        run: |
          cd frontend
          VITE_APP_ROLE=customer npm run build
          VITE_APP_ROLE=customer npx cap sync android
          cd ../android
          ./gradlew assemble${BUILD_TYPE^} --no-daemon
          VERSION=$(grep '^versionName' version.properties | cut -d= -f2)
          mkdir -p "${GITHUB_WORKSPACE}/releases"
          cp app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk "${GITHUB_WORKSPACE}/releases/LuckySeva-v$VERSION.apk"

      - name: Build provider APK
        run: |
          cd frontend
          VITE_APP_ROLE=provider npm run build
          VITE_APP_ROLE=provider npx cap sync android
          cd ../android
          ./gradlew assemble${BUILD_TYPE^} --no-daemon
          VERSION=$(grep '^versionName' version.properties | cut -d= -f2)
          mkdir -p "${GITHUB_WORKSPACE}/releases"
          cp app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk "${GITHUB_WORKSPACE}/releases/LuckySeva-Partner-v$VERSION.apk"

      - name: Publish APKs to the version release
        if: env.BUILD_TYPE == 'release'
        working-directory: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release tag always tracks version.properties, so bumping versionName in a
          # PR is the only step needed to cut a new release: on merge this step creates
          # tag v<version> + release, and refreshes the assets when it already exists.
          VERSION=$(grep '^versionName' ../android/version.properties | cut -d= -f2)
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" LuckySeva-*.apk --clobber --repo "${{ github.repository }}"
            echo "Refreshed existing release $TAG with APKs built from ${{ github.sha }}"
          else
            gh release create "$TAG" LuckySeva-*.apk \
              --repo "${{ github.repository }}" \
              --title "LuckySeva $TAG" \
              --notes "Signed Android APKs (customer + partner) for LuckySeva $TAG, built automatically from ${{ github.sha }}." \
              --latest
            echo "Created release $TAG with APKs built from ${{ github.sha }}"
          fi

      - name: Prune stale release assets
        if: env.BUILD_TYPE == 'release'
        working-directory: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Uploads only refresh/overwrite matching asset names, so artifacts left over
          # from older naming schemes (e.g. LuckySeva-1.0.0.apk before the v-prefix rule)
          # would otherwise stay pinned to the release forever. Delete anything that is
          # not one of the two fresh APKs of the current version.
          VERSION=$(grep '^versionName' ../android/version.properties | cut -d= -f2)
          TAG="v$VERSION"
          KEEP1="LuckySeva-v$VERSION.apk"
          KEEP2="LuckySeva-Partner-v$VERSION.apk"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' > /tmp/assets.txt
          while IFS= read -r asset; do
            if [ "$asset" != "$KEEP1" ] && [ "$asset" != "$KEEP2" ]; then
              echo "Deleting stale asset: $asset"
              ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
                --jq ".assets[] | select(.name == \"$asset\") | .id")
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            else
              echo "Keeping fresh asset: $asset"
            fi
          done < /tmp/assets.txt

      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ github.run_number }}
          path: releases/*.apk
          if-no-files-found: error
