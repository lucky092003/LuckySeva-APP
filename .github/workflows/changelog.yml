name: Pull request changelog

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if ! printf '%s\n' "$changed_files" | grep -Fxq 'CHANGELOG.md'; then
            echo "::error::Every pull request must update CHANGELOG.md."
            exit 1
          fi
          echo "CHANGELOG.md is included in this pull request."
